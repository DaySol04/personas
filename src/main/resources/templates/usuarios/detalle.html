<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Detalle de Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark px-3">
        <span class="navbar-brand">Detalle de Usuario</span>
        <div class="d-flex align-items-center gap-3">
            <span class="text-white">Hola, <b sec:authentication="name"></b></span>
            <form th:action="@{/logout}" method="post">
                <button class="btn btn-outline-light btn-sm">Salir</button>
            </form>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="card shadow-sm" style="max-width: 600px; margin: 0 auto;">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Información del Usuario</h4>
            </div>
            <div class="card-body">
                <ul class="list-group list-group-flush mb-3">
                    <li class="list-group-item"><b>ID:</b> <span th:text="${usuario.id}"></span></li>
                    <li class="list-group-item"><b>Nombre:</b> <span th:text="${usuario.nombre}"></span></li>
                    <li class="list-group-item"><b>Username:</b> <span th:text="${usuario.username}"></span></li>
                    <li class="list-group-item"><b>Email:</b> <span th:text="${usuario.email}"></span></li>
                    <li class="list-group-item"><b>Teléfono:</b> <span th:text="${usuario.telefono}"></span></li>
                    <li class="list-group-item"><b>Rol:</b> <span th:text="${usuario.rol}"></span></li>
                    <li class="list-group-item">
                        <b>Estado:</b> 
                        <span th:if="${usuario.activo}" class="badge bg-success">Activo</span>
                        <span th:unless="${usuario.activo}" class="badge bg-secondary">Inactivo</span>
                    </li>
                </ul>

                <div class="d-flex justify-content-between">
                    <a th:href="@{/usuarios}" class="btn btn-secondary">Volver a la lista</a>
                    
                    <!-- el boton editar se muetra solo para admi -->
                    <a sec:authorize="hasRole('ADMIN')" th:href="@{/usuarios/{id}/editar(id=${usuario.id})}" class="btn btn-warning">Editar</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
